[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true

# Read-only access to the shared test fixtures. `test/fixtures/protect-eligibility-truth-table.json`
# is the hand-written specification of the promotion predicate, verified by both the Solidity
# library and its TypeScript mirror; the Solidity side needs `vm.readFile` to check it.
# Scoped to that one directory and to reads only — no write permission is granted.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
