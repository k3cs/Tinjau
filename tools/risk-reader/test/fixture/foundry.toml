# Self-contained Foundry project for ONE test fixture contract.
#
# It is deliberately separate from ../../../../contracts/foundry.toml and has no `libs`:
# FutureSchemaRegistry.sol imports nothing, not even forge-std. That keeps the reference
# consumer's test harness from quietly acquiring a dependency on Tinjau's contract project.
[profile.default]
src = "src"
out = "out"
libs = []
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
